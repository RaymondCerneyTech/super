name: grammar_correction
description: Improve grammatical correctness and style of text.
inputs: [text]
outputs: [corrected_text]
args:
  grammar_mode:
    type: str
    default: standard
    enum: [standard, aggressive]
keywords:
  - grammar
  - correct
  - proofread
  - style
success_checks:
  - type: similarity_cosine
    source: text
    target: corrected_text
    weight: 0.5
    reward_key: relevance
  - type: length_leq
    target: corrected_text
    arg: max_words
    weight: 0.25
    reward_key: brevity
  - type: length_leq
    target: corrected_text
    arg: 200
    weight: 0.25
    reward_key: fluency
