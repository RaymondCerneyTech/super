name: sentiment_analysis
description: Detect sentiment polarity, fine-grained emotion, and intensity.
inputs: [text]
outputs: [sentiment, sentiment_score, sentiment_category, sentiment_intensity, analysis_text]
keywords:
  - sentiment
  - emotion
  - positive
  - negative
  - sarcasm
success_checks:
  - type: similarity_cosine
    source: text
    target: analysis_text
    weight: 0.4
    reward_key: relevance
  - type: length_leq
    target: analysis_text
    arg: max_words
    weight: 0.3
    reward_key: coherence
  - type: length_leq
    target: sentiment
    arg: 3
    weight: 0.15
    reward_key: label_simplicity
  - type: length_leq
    target: sentiment_category
    arg: 3
    weight: 0.15
    reward_key: category_focus
