name: rewrite_style
description: Adjust the tone of text to either a professional or casual style.
inputs: [text]
outputs: [rewritten_text, tone]
args:
  tone:
    type: str
    default: professional
    enum: [professional, casual]
keywords:
  - rewrite
  - style
  - tone
  - casual
  - professional
preconditions:
  - "text_len > 0"
effects: [tone_adjusted, creative_tone]
cost: 1.1
capabilities: [creative]
requires_explanation: true
success_checks:
  - type: tone_keyword_match
    target: rewritten_text
    arg: tone
    weight: 1.0
    threshold: 0.5
    reward_key: tone_keyword_match
